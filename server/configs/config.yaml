server:
  port: 8080
  mode: debug
  read_timeout: 60
  write_timeout: 60

database:
  driver: mysql
  host: localhost
  port: 3306
  username: root
  password: ""
  database: infra
  charset: utf8mb4
  max_idle_conns: 10
  max_open_conns: 100
  conn_max_lifetime: 3600

redis:
  host: localhost
  port: 6379
  password: ""
  db: 0
  pool_size: 10

jwt:
  secret: infra-jwt-secret-key
  expire: 7200

log:
  level: info
  filename: logs/app.log
  max_size: 100
  max_backups: 3
  max_age: 7
  compress: true

captcha:
  enabled: false
  mode: digit             # digit | string | math | chinese
  length: 4
  width: 240
  height: 80
  expire: 300


oss:
  endpoint: oss-cn-hangzhou.aliyuncs.com
  access_key_id: ""
  access_key_secret: ""
  bucket: ""
  base_path: uploads/