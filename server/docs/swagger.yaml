basePath: /
definitions:
  auth.ForgotPasswordReq:
    properties:
      captcha_ans:
        type: string
      captcha_id:
        type: string
      username:
        type: string
    required:
    - captcha_ans
    - captcha_id
    - username
    type: object
  auth.LoginReq:
    properties:
      captcha_ans:
        type: string
      captcha_id:
        type: string
      password:
        maxLength: 32
        minLength: 6
        type: string
      username:
        maxLength: 64
        minLength: 3
        type: string
    required:
    - captcha_ans
    - captcha_id
    - password
    - username
    type: object
  auth.LoginResp:
    properties:
      expire_at:
        type: integer
      token:
        type: string
    type: object
  auth.RegisterReq:
    properties:
      captcha_ans:
        type: string
      captcha_id:
        type: string
      email:
        maxLength: 128
        type: string
      nickname:
        maxLength: 64
        type: string
      password:
        maxLength: 32
        minLength: 6
        type: string
      phone:
        maxLength: 20
        type: string
      username:
        maxLength: 64
        minLength: 3
        type: string
    required:
    - captcha_ans
    - captcha_id
    - nickname
    - password
    - username
    type: object
  auth.ResetPasswordReq:
    properties:
      new_password:
        maxLength: 32
        minLength: 6
        type: string
      old_password:
        type: string
      username:
        type: string
    required:
    - new_password
    - old_password
    - username
    type: object
  response.Response:
    properties:
      code:
        type: integer
      data: {}
      msg:
        type: string
    type: object
  user.CreateUserReq:
    properties:
      email:
        maxLength: 128
        type: string
      gender:
        enum:
        - 0
        - 1
        - 2
        type: integer
      nickname:
        maxLength: 64
        type: string
      password:
        maxLength: 32
        minLength: 6
        type: string
      phone:
        maxLength: 20
        type: string
      remark:
        maxLength: 256
        type: string
      username:
        maxLength: 64
        minLength: 3
        type: string
    required:
    - nickname
    - password
    - username
    type: object
  user.UpdateUserReq:
    properties:
      email:
        maxLength: 128
        type: string
      gender:
        enum:
        - 0
        - 1
        - 2
        type: integer
      nickname:
        maxLength: 64
        type: string
      phone:
        maxLength: 20
        type: string
      remark:
        maxLength: 256
        type: string
      status:
        enum:
        - 0
        - 1
        type: integer
    type: object
  user.UserListResp:
    properties:
      list:
        items:
          $ref: '#/definitions/user.UserResp'
        type: array
      page:
        type: integer
      pageSize:
        type: integer
      total:
        type: integer
    type: object
  user.UserResp:
    properties:
      avatar:
        type: string
      created_at:
        type: string
      email:
        type: string
      gender:
        type: integer
      id:
        type: integer
      nickname:
        type: string
      phone:
        type: string
      remark:
        type: string
      status:
        type: integer
      updated_at:
        type: string
      username:
        type: string
    type: object
  utils.CaptchaResult:
    properties:
      captcha_id:
        type: string
      image:
        type: string
    type: object
host: localhost:8080
info:
  contact:
    email: chengjin@example.com
    name: CJ
  description: Infra 后端API服务
  license:
    name: Apache 2.0
    url: http://www.apache.org/licenses/LICENSE-2.0.html
  title: Infra API
  version: 1.0.0
paths:
  /api/v1/captcha:
    get:
      consumes:
      - application/json
      description: 获取数字验证码
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/response.Response'
            - properties:
                data:
                  $ref: '#/definitions/utils.CaptchaResult'
              type: object
      summary: 获取验证码
      tags:
      - Auth
  /api/v1/forgot-password:
    post:
      consumes:
      - application/json
      description: 通过用户名 + 验证码获取新密码
      parameters:
      - description: 忘记密码请求
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/auth.ForgotPasswordReq'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/response.Response'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/response.Response'
      summary: 忘记密码
      tags:
      - Auth
  /api/v1/login:
    post:
      consumes:
      - application/json
      description: 用户名密码 + 验证码登录
      parameters:
      - description: 登录请求
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/auth.LoginReq'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/response.Response'
            - properties:
                data:
                  $ref: '#/definitions/auth.LoginResp'
              type: object
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/response.Response'
      summary: 用户登录
      tags:
      - Auth
  /api/v1/register:
    post:
      consumes:
      - application/json
      description: 用户注册
      parameters:
      - description: 注册请求
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/auth.RegisterReq'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/response.Response'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/response.Response'
      summary: 用户注册
      tags:
      - Auth
  /api/v1/reset-password:
    post:
      consumes:
      - application/json
      description: 旧密码校验后设置新密码
      parameters:
      - description: 重置密码请求
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/auth.ResetPasswordReq'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/response.Response'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/response.Response'
      summary: 重置密码
      tags:
      - Auth
  /api/v1/users:
    get:
      consumes:
      - application/json
      description: 查询用户列表
      parameters:
      - description: 页码
        in: query
        name: page
        type: integer
      - description: 每页数量
        in: query
        name: pageSize
        type: integer
      - description: 用户名
        in: query
        name: username
        type: string
      - description: 昵称
        in: query
        name: nickname
        type: string
      - description: 状态
        in: query
        name: status
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/response.Response'
            - properties:
                data:
                  $ref: '#/definitions/user.UserListResp'
              type: object
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/response.Response'
      security:
      - BearerAuth: []
      summary: 用户列表
      tags:
      - User
    post:
      consumes:
      - application/json
      description: 创建用户
      parameters:
      - description: 创建用户请求
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/user.CreateUserReq'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/response.Response'
            - properties:
                data:
                  $ref: '#/definitions/user.UserResp'
              type: object
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/response.Response'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/response.Response'
      security:
      - BearerAuth: []
      summary: 创建用户
      tags:
      - User
  /api/v1/users/{id}:
    delete:
      consumes:
      - application/json
      description: 删除用户
      parameters:
      - description: 用户ID
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/response.Response'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/response.Response'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/response.Response'
      security:
      - BearerAuth: []
      summary: 删除用户
      tags:
      - User
    get:
      consumes:
      - application/json
      description: 获取用户详情
      parameters:
      - description: 用户ID
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/response.Response'
            - properties:
                data:
                  $ref: '#/definitions/user.UserResp'
              type: object
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/response.Response'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/response.Response'
      security:
      - BearerAuth: []
      summary: 获取用户详情
      tags:
      - User
    put:
      consumes:
      - application/json
      description: 更新用户
      parameters:
      - description: 用户ID
        in: path
        name: id
        required: true
        type: integer
      - description: 更新用户请求
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/user.UpdateUserReq'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/response.Response'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/response.Response'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/response.Response'
      security:
      - BearerAuth: []
      summary: 更新用户
      tags:
      - User
schemes:
- http
- https
securityDefinitions:
  BearerAuth:
    description: 输入 "Bearer <token>"，登录接口返回的 token
    in: header
    name: Authorization
    type: apiKey
swagger: "2.0"
